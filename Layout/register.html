<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body style="background: linear-gradient(135deg, #000000 0%, #343a40 100%); min-height: 100vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body py-5 px-4">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-dark">Registrasi Siswa</h3>
                            <p class="text-muted">lengkapi data untuk membuat akun</p>
                            </div>
                            <form action="" method="POST">
                            <div class="mb-3">
                                <label for="nis" class="form-label text-secondary fw-semibold">Nis</label>
                                <input type="text" name="nis" class="form-control border-0 bg-light" placeholder="masukan nis mu" required>
                            </div>
                            <div class="mb-3">
                                <label for="nama" class="form-label text-secondary fw-semibold">Nama</label>
                                <input type="text" name="nama" class="form-control border-0 bg-light" placeholder="masukan nama mu" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control border-0 bg-light" placeholder="masukan password mu" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="konfirmasi_password" class="form-label text-secondary fw-semibold">Konfirmasi</label>
                                <input type="password" name="konfirmasi_password" class="form-control border-0 bg-light" placeholder="konfirmasi password mu" required>
                            </div>
                            </div>
                            <button type="submit" name="register" class="btn btn-dark w-100 btn-lg shadow-sm mt-3">Daftar Akun</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
